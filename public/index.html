<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H2S // FARM CONTROL</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
    <style>
        :root {
            --neon-green: #00ff41; --neon-pink: #ff0055; --neon-blue: #00e5ff; --neon-yellow: #fcee0a;
            --dark-bg: #050505; --panel-bg: rgba(16, 20, 24, 0.95);
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--dark-bg); color: var(--neon-green);
            font-family: 'Share Tech Mono', monospace; margin: 0; overflow: hidden;
            height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 60%);
        }

        /* HEADER */
        header {
            height: 45px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; border-bottom: 1px solid var(--neon-blue); background: #000;
        }
        .brand { font-size: 1.2em; color: var(--neon-blue); letter-spacing: 2px; font-weight: bold;}
        nav button {
            background: transparent; border: 1px solid #333; color: #666; padding: 4px 12px;
            cursor: pointer; font-family: inherit; margin-left: 5px; font-size: 0.9em; transition: 0.3s;
        }
        nav button.active { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 8px rgba(0,255,65,0.3); }

        /* MAIN CONTENT */
        main { flex-grow: 1; position: relative; padding: 8px; overflow-y: auto; }
        section { display: none; height: 100%; }
        section.active-section { display: block; height: 100%; }

        /* GRID SYSTEM RESPONSIVE */
        #supervision-grid { display: grid; gap: 10px; padding-bottom: 50px; height: 100%; }
        /* Mobile */
        #supervision-grid { grid-template-columns: 1fr; grid-auto-rows: 300px; }
        /* Tablette */
        @media (min-width: 768px) { #supervision-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(300px, 1fr); } }
        /* PC */
        @media (min-width: 1200px) { #supervision-grid { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; height: 100%; } .printer-card { height: 100%; } }

        /* CARD STYLE */
        .printer-card {
            background: var(--panel-bg); border: 1px solid #333;
            padding: 6px; display: flex; flex-direction: column;
            position: relative; box-shadow: 0 0 10px rgba(0,0,0,0.5); min-height: 0; 
        }
        .printer-card[data-status="Printing"] { border-color: var(--neon-green); }
        .printer-card[data-status="PAUSED"] { border-color: var(--neon-yellow); }
        .printer-card[data-status="Offline"] { border-color: #333; opacity: 0.6; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 1em; border-bottom: 1px solid #333; padding-bottom: 2px; }

        /* CAMERA CONTAINER */
        .cam-zone {
            flex-grow: 1; background: #000; margin-bottom: 4px; 
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #222;
        }
        
        /* PETIT BOUTON PLEIN ECRAN (DANS LA CARTE) */
        .btn-fullscreen {
            position: absolute; top: 5px; right: 5px;
            background: rgba(0,0,0,0.7); color: white;
            border: 1px solid var(--neon-blue); border-radius: 3px;
            cursor: pointer; padding: 2px 5px; font-size: 0.8em; z-index: 10;
        }
        .btn-fullscreen:hover { background: var(--neon-blue); color: black; }

        /* VUE CARTE (PETITE) */
        .cam-zone img { width: 100%; height: 100%; object-fit: cover; display: block; border: none; }
        /* Bambu Zoom Petite Vue */
        .zoomed-iframe { width: 100%; height: 100%; border: none; transform: scale(1.25); transform-origin: center center; pointer-events: none; }
        /* Ultimaker Rotation Petite Vue (Scale 0.65 pour fit) */
        .rotated-cam {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            transform: translate(-50%, -50%) rotate(90deg) scale(0.65);
            object-fit: contain; pointer-events: none;
        }
        
        .no-cam { color: #444; font-size: 0.8em; text-align: center; width:100%; }

        /* --- OVERLAY PLEIN ECRAN --- */
        #fs-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 2000;
            align-items: center; justify-content: center;
        }
        #fs-content { width: 100%; height: 100%; position: relative; display:flex; align-items:center; justify-content:center; }
        
        /* BOUTON QUITTER PLEIN ECRAN */
        .btn-close-fs {
            position: absolute; top: 20px; right: 20px;
            background: var(--neon-pink); color: white;
            border: none; padding: 10px 20px; font-weight: bold; cursor: pointer;
            z-index: 2001; font-family: inherit; font-size: 1.2em;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }

        /* Styles Spécifiques Plein Ecran */
        .fs-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .fs-iframe { width: 100%; height: 100%; border: none; }
        
        /* Ultimaker en Plein Ecran : Rotation 90° simple (le contain du parent gère le reste) */
        /* Astuce : on inverse largeur/hauteur max pour que ça tienne */
        .fs-rotated {
            transform: rotate(90deg);
            max-width: 90vh; /* La largeur de l'image (hauteur écran) */
            max-height: 90vw; /* La hauteur de l'image (largeur écran) */
            object-fit: contain;
        }

        /* INFOS & CONTROLS */
        .info-row { display: flex; justify-content: space-between; font-size: 0.8em; margin-bottom: 2px; }
        .filename { color: var(--neon-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
        .progress-container { height: 10px; background: #222; margin: 3px 0; position: relative; border: 1px solid #444; }
        .progress-bar { height: 100%; background: var(--neon-green); width: 0%; transition: width 0.5s; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .pla-input { background: transparent; border: 1px solid #444; color: var(--neon-pink); width: 50px; text-align: center; font-family: inherit; font-size: 1em; }
        .btn-pause { background: transparent; border: 1px solid var(--neon-yellow); color: var(--neon-yellow); cursor: pointer; font-family: inherit; padding: 6px 10px; font-size: 0.9em; transition: 0.2s; text-transform: uppercase; margin-left: auto; }
        .btn-pause:hover { background: var(--neon-yellow); color: black; }

        /* MODAL UPLOAD */
        #upload-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #111; border: 2px solid var(--neon-pink); padding: 20px; width: 350px; text-align: center; }
        .input-group input { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 8px; margin-bottom: 10px; }
        .btn-confirm { background: var(--neon-pink); color: white; border: none; padding: 10px; width: 100%; cursor: pointer; }
        #depot { display: none; height: 100%; flex-direction: column; justify-content: center; }
        #drop-area { border: 2px dashed var(--neon-pink); height: 80%; display: flex; align-items: center; justify-content: center; color: var(--neon-pink); cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="brand">/// FARM CONTROL</div>
        <nav>
            <button onclick="switchTab('supervision')" class="active" id="btn-supervision">SUPERVISION</button>
            <button onclick="switchTab('depot')" id="btn-depot">DÉPOT FICHIERS</button>
            <a href="/aide/index.html" style="text-decoration:none"><button>AIDE</button></a>
        </nav>
    </header>

    <main>
        <section id="supervision" class="active-section">
            <div id="supervision-grid"></div>
        </section>

        <section id="depot">
            <input type="file" id="fileElem" style="display:none" onchange="handleFiles(this.files)">
            <div id="drop-area" onclick="document.getElementById('fileElem').click()">
                <div style="text-align: center;">
                    <h1>ZONE DE TÉLÉVERSEMENT</h1>
                    <p>GLISSEZ VOS FICHIERS STL ICI<br><span style="font-size:0.6em; color:#666">(OU CLIQUEZ POUR PARCOURIR)</span></p>
                </div>
            </div>
        </section>
    </main>

    <div id="fs-overlay">
        <button class="btn-close-fs" onclick="closeFullscreen()">X FERMER</button>
        <div id="fs-content">
            </div>
    </div>

    <div id="upload-modal">
        <div class="modal-content">
            <h3 style="color:var(--neon-pink); margin-top:0">IDENTIFICATION</h3>
            <div class="input-group">
                <input type="text" id="user-firstname" placeholder="Votre Prénom">
                <input type="text" id="user-lastname" placeholder="Votre Nom">
            </div>
            <button class="btn-confirm" onclick="confirmUpload()">ENVOYER</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#666; margin-top:10px; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <script>
        const socket = io();
        const supervisionGrid = document.getElementById('supervision-grid');
        let pendingFile = null;
        let printerDataCache = {}; // Pour stocker les données et ouvrir le FS

        function switchTab(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(id === 'depot') document.getElementById('depot').style.display = 'flex';
            else document.getElementById('depot').style.display = 'none';
            if(id !== 'depot') document.getElementById(id).classList.add('active-section');
            document.getElementById('btn-'+id).classList.add('active');
        }

        // --- GESTION PLEIN ECRAN ---
        function openFullscreen(id) {
            const data = printerDataCache[id];
            if (!data || !data.camUrl) return;
            
            const overlay = document.getElementById('fs-overlay');
            const container = document.getElementById('fs-content');
            container.innerHTML = ''; // Clean

            if (data.camUrl.includes('.html')) {
                // Bambu (Iframe)
                container.innerHTML = `<iframe src="${data.camUrl}" class="fs-iframe"></iframe>`;
            } else {
                if(data.type === 'octo') {
                    // Ultimaker (Rotated)
                    container.innerHTML = `<img src="${data.camUrl}" class="fs-rotated">`;
                } else {
                    // Standard
                    container.innerHTML = `<img src="${data.camUrl}" class="fs-img">`;
                }
            }
            overlay.style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fs-overlay').style.display = 'none';
            document.getElementById('fs-content').innerHTML = ''; // Stop stream/iframe
        }

        function createOrUpdateCard(data) {
            // Mise en cache pour le bouton FS
            printerDataCache[data.id] = data;

            let card = document.getElementById(`printer-${data.id}`);
            if (!card) {
                card = document.createElement('div');
                card.className = 'printer-card';
                card.id = `printer-${data.id}`;
                
                let camContent = '<div class="no-cam">[NO SIGNAL]</div>';
                
                // Logique d'affichage Petite Vue
                if (data.type === 'connect') {
                    camContent = '<div class="no-cam">[NO CAM]</div>';
                } else if (data.camUrl) {
                    if (data.camUrl.includes('.html')) {
                        camContent = `<iframe src="${data.camUrl}" class="zoomed-iframe"></iframe>`;
                    } else {
                        if(data.type === 'octo') {
                            camContent = `<img src="${data.camUrl}" class="rotated-cam">`;
                        } else {
                            camContent = `<img src="${data.camUrl}">`;
                        }
                    }
                }

                // AFFICHAGE FILAMENT
                let spoolDisplay = '';
                if (data.type === 'bambu') {
                    spoolDisplay = `<div style="display:flex; align-items:center; font-size:0.8em">${data.pla}</div>`;
                } else {
                    spoolDisplay = `PLA: <input type="number" class="pla-input" value="${data.pla}" onchange="updatePla('${data.id}', this.value)"> g`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span style="font-weight:bold">${data.name}</span>
                        <span class="status-txt" style="font-size:0.8em; color:var(--neon-blue)">${data.status}</span>
                    </div>
                    
                    <div class="cam-zone">
                        ${camContent}
                        ${data.camUrl ? `<button class="btn-fullscreen" onclick="openFullscreen('${data.id}')">⤢</button>` : ''}
                    </div>
                    
                    <div class="info-row">
                        <span class="filename">--</span>
                        <span class="end-time" style="color:#aaa">--:--</span>
                    </div>
                    <div class="progress-container"><div class="progress-bar"></div></div>
                    <div class="info-row">
                        <span>Buse: <span class="temp-nozzle" style="color:var(--neon-pink)">0</span>°C</span>
                        <span>Lit: <span class="temp-bed" style="color:var(--neon-pink)">0</span>°C</span>
                    </div>
                    <div class="controls">
                        <div style="font-size:0.8em">${spoolDisplay}</div>
                        <button class="btn-pause" onclick="togglePause('${data.id}')">PAUSE</button>
                    </div>
                `;
                supervisionGrid.appendChild(card);
            }

            // Updates
            card.setAttribute('data-status', data.status);
            card.querySelector('.status-txt').innerText = data.status;
            card.querySelector('.filename').innerText = data.filename || "";
            card.querySelector('.end-time').innerText = "Fin: " + data.endTime;
            card.querySelector('.progress-bar').style.width = data.progress + '%';
            card.querySelector('.temp-nozzle').innerText = data.tempNozzle;
            card.querySelector('.temp-bed').innerText = data.tempBed;

            // Caméra Update
            let camZone = card.querySelector('.cam-zone');
            // On vérifie si le bouton FS existe, sinon on le rajoute
            if(data.camUrl && !camZone.querySelector('.btn-fullscreen')) {
                let btn = document.createElement('button');
                btn.className = 'btn-fullscreen';
                btn.innerText = '⤢';
                btn.onclick = () => openFullscreen(data.id);
                camZone.appendChild(btn);
            }

            if (data.camUrl) {
                if (data.camUrl.includes('.html')) {
                    let iframe = camZone.querySelector('iframe');
                    if(!iframe || iframe.src !== data.camUrl) {
                        // On nettoie pour éviter les doublons
                        let oldImg = camZone.querySelector('img'); if(oldImg) oldImg.remove();
                        // On crée ou met à jour l'iframe
                        if(!iframe) {
                            let newIframe = document.createElement('iframe');
                            newIframe.src = data.camUrl;
                            newIframe.className = "zoomed-iframe";
                            camZone.insertBefore(newIframe, camZone.firstChild); // Insérer AVANT le bouton
                        }
                    }
                } else {
                    let img = camZone.querySelector('img');
                    if(!img) {
                        let oldIframe = camZone.querySelector('iframe'); if(oldIframe) oldIframe.remove();
                        let newImg = document.createElement('img');
                        newImg.src = data.camUrl;
                        if(data.type === 'octo') newImg.className = "rotated-cam";
                        camZone.insertBefore(newImg, camZone.firstChild);
                    }
                }
            }

            // Saisie PLA
            if (data.type !== 'bambu') {
                let plaInput = card.querySelector('.pla-input');
                if (plaInput && document.activeElement !== plaInput) {
                    plaInput.value = data.pla;
                }
            } else {
                let spoolDiv = card.querySelector('.controls div');
                if(spoolDiv) spoolDiv.innerHTML = data.pla; 
            }

            let btnPause = card.querySelector('.btn-pause');
            let s = data.status.toLowerCase();
            if(s.includes('paused') || s.includes('pausing')) {
                btnPause.style.background = 'var(--neon-yellow)'; btnPause.style.color = 'black'; btnPause.innerText = "▶ RESUME";
            } else {
                btnPause.style.background = 'transparent'; btnPause.style.color = 'var(--neon-yellow)'; btnPause.innerText = "⏸ PAUSE";
            }
        }

        socket.on('printer_update', (data) => createOrUpdateCard(data));
        window.updatePla = (id, val) => socket.emit('set_pla', {id, value: val});
        window.togglePause = (id) => socket.emit('toggle_pause', {id});
        function handleFiles(files) { if(files.length > 0) { pendingFile = files[0]; modal.style.display = 'flex'; document.getElementById('user-firstname').focus(); }}
        
        const dropArea = document.getElementById('drop-area');
        const modal = document.getElementById('upload-modal');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(e => dropArea.addEventListener(e, (ev) => { ev.preventDefault(); ev.stopPropagation(); }));
        dropArea.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        function closeModal() { modal.style.display = 'none'; pendingFile = null; }
        function confirmUpload() {
            const fname = document.getElementById('user-firstname').value;
            const lname = document.getElementById('user-lastname').value;
            if(!fname || !lname || !pendingFile) return;
            let formData = new FormData();
            formData.append('firstname', fname); formData.append('lastname', lname); formData.append('file', pendingFile);
            fetch('/upload', { method: 'POST', body: formData })
            .then(r => r.json()).then(d => { alert("Fichier envoyé : " + d.filename); closeModal(); switchTab('supervision'); })
            .catch(e => alert("Erreur upload"));
        }
    </script>
</body>
</html>
